name: mcp-access-boundary
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Build the locked regular MCP binary
        run: cargo build --locked --bin chapter-publishing-mcp-server
      - uses: ORESoftware/org-mcp-server-template.rs/.github/actions/access-boundary@c52be23e082753c27ca392fb2f439c764d3ca95e
        with:
          binary: target/debug/chapter-publishing-mcp-server
          organization: chapter-publishing
          repository: chapter-publishing/cp-mcp-server.rs
          expected-tools-json: '["environment_policy","org_identity","security_baseline","shared_auth_policy","telemetry_status","zed_dependency_graph"]'
  generated-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Normalize generated Rust with the actual formatter
        run: |
          bash -n scripts/format-generated-rust.sh
          bash scripts/format-generated-rust.sh
          git diff -- generated/rust > generated-rust-format.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-rust-format-${{ github.run_id }}
          path: |
            generated/rust/
            generated-rust-format.patch
          if-no-files-found: error
          retention-days: 30
      - name: Require the checked-in outputs to already match
        run: git diff --exit-code -- generated/rust
